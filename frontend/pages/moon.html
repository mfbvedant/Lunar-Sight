<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LunarSight — Realistic Interactive Moon</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Space+Mono&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 20%, #1c2740 0%, #090b12 45%, #020306 100%);
      overflow: hidden;
      font-family: 'Space Grotesk', Arial, sans-serif;
      user-select: none;
    }

    #moon-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      cursor: grab;
    }
    #moon-canvas:active { cursor: grabbing; }

    /* Controls Overlay */
    .controls-hint {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.7);
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: rgba(9, 11, 18, 0.8);
      padding: 10px 22px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      pointer-events: none;
      z-index: 50;
      backdrop-filter: blur(12px);
    }

    /* Telemetry HUD Panel */
    .telemetry-hud {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(9, 11, 18, 0.88);
      border: 1px solid rgba(0, 212, 170, 0.35);
      border-radius: 16px;
      padding: 16px 32px;
      backdrop-filter: blur(20px);
      color: white;
      display: flex;
      gap: 36px;
      z-index: 50;
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(0, 212, 170, 0.2);
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      opacity: 0;
      transform: translate(-50%, 10px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .telemetry-hud.visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .hud-stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .hud-label {
      color: rgba(255, 255, 255, 0.5);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .hud-val {
      color: #00D4AA;
      font-weight: 700;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="controls-hint">DRAG TO ROTATE MOON IN 3D • SCROLL TO ZOOM • CLICK CRATERS</div>

  <canvas id="moon-canvas"></canvas>

  <!-- Telemetry HUD -->
  <div class="telemetry-hud" id="telemetry-hud">
    <div class="hud-stat">
      <span class="hud-label">Target Crater</span>
      <span class="hud-val" id="hud-target">SHACKLETON</span>
    </div>
    <div class="hud-stat">
      <span class="hud-label">Ice Deposit Prob</span>
      <span class="hud-val" id="hud-prob">94.8%</span>
    </div>
    <div class="hud-stat">
      <span class="hud-label">PSR Temp</span>
      <span class="hud-val" id="hud-temp">40 K (-233°C)</span>
    </div>
    <div class="hud-stat">
      <span class="hud-label">S-Band CPR</span>
      <span class="hud-val" id="hud-cpr">1.48 (Volatiles)</span>
    </div>
  </div>

  <script>
    (function() {
      'use strict';
      const canvas = document.getElementById('moon-canvas');
      const hud = document.getElementById('telemetry-hud');

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 5.0;

      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.3;

      // Lights
      scene.add(new THREE.AmbientLight(0x303040, 0.3));

      const sunLight = new THREE.DirectionalLight(0xfff8e8, 3.8);
      sunLight.position.set(5, 3.5, 5);
      scene.add(sunLight);

      const fillLight = new THREE.DirectionalLight(0x607090, 0.15);
      fillLight.position.set(-3, -2, 2);
      scene.add(fillLight);

      // Starfield
      const starCount = 1000;
      const starPos = new Float32Array(starCount * 3);
      for (let i = 0; i < starCount; i++) {
        starPos[i*3]     = (Math.random() - 0.5) * 300;
        starPos[i*3 + 1] = (Math.random() - 0.5) * 300;
        starPos[i*3 + 2] = (Math.random() - 0.5) * 300;
      }
      const starGeo = new THREE.BufferGeometry();
      starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
      scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.4 })));

      // 3D Moon with Uploaded 2k_moon Texture
      const moonGeo = new THREE.SphereGeometry(1.8, 128, 128);
      const moonMat = new THREE.MeshPhongMaterial({
        shininess: 6,
        specular: new THREE.Color(0x1a1a1a),
      });

      const moon = new THREE.Mesh(moonGeo, moonMat);
      moon.rotation.x = 0.45;
      scene.add(moon);

      const textureLoader = new THREE.TextureLoader();
      textureLoader.load('../assets/2k_moon.jpg', function(tex) {
        tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
        moonMat.map = tex;
        moonMat.bumpMap = tex;
        moonMat.bumpScale = 0.04;
        moonMat.needsUpdate = true;
      });

      // Atmosphere Glow
      const atmGeo = new THREE.SphereGeometry(1.85, 64, 64);
      const atmMat = new THREE.ShaderMaterial({
        uniforms: { viewVec: { value: camera.position } },
        vertexShader: `
          uniform vec3 viewVec;
          varying float intensity;
          void main() {
            vec3 vNorm = normalize(normalMatrix * normal);
            vec3 vView = normalize(normalMatrix * viewVec);
            intensity = pow(0.62 - dot(vNorm, vView), 3.2);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          varying float intensity;
          void main() {
            vec3 glow = vec3(0.40, 0.38, 0.58) * intensity;
            gl_FragColor = vec4(glow, intensity * 0.3);
          }
        `,
        side: THREE.FrontSide,
        blending: THREE.AdditiveBlending,
        transparent: true,
        depthWrite: false,
      });
      scene.add(new THREE.Mesh(atmGeo, atmMat));

      // Hotspots
      const hotspots = [
        { name: "SHACKLETON", latlon: "89.9°S 0.0°E", prob: "94.8%", cpr: "1.48", temp: "40 K (-233°C)", pos: new THREE.Vector3(0, -1.75, 0.45) },
        { name: "CABEUS", latlon: "84.9°S 35.5°W", prob: "96.4%", cpr: "1.61", temp: "38 K (-235°C)", pos: new THREE.Vector3(-0.35, -1.60, 0.8) },
        { name: "HAWORTH", latlon: "87.4°S 2.6°W", prob: "91.2%", cpr: "1.42", temp: "42 K (-231°C)", pos: new THREE.Vector3(0.55, -1.68, 0.35) },
      ];

      const hotspotMeshes = [];
      hotspots.forEach(h => {
        const dot = new THREE.Mesh(new THREE.SphereGeometry(0.045, 16, 16), new THREE.MeshBasicMaterial({ color: 0x00D4AA }));
        dot.position.copy(h.pos);
        dot.userData = h;
        moon.add(dot);
        hotspotMeshes.push(dot);

        const ring = new THREE.Mesh(new THREE.RingGeometry(0.06, 0.09, 32), new THREE.MeshBasicMaterial({ color: 0x00D4AA, transparent: true, opacity: 0.4, side: THREE.DoubleSide }));
        ring.position.copy(h.pos);
        ring.lookAt(0, 0, 0);
        moon.add(ring);
      });

      // Interactions: Drag Rotate + Inertia + Zoom
      let isDragging = false;
      let prevMouse = { x: 0, y: 0 };
      let velocity = { x: 0, y: 0.002 };
      const INERTIA = 0.95;
      const raycaster = new THREE.Raycaster();
      const mouseVec = new THREE.Vector2();

      function onDown(e) {
        isDragging = true;
        const p = e.touches ? e.touches[0] : e;
        prevMouse = { x: p.clientX, y: p.clientY };
      }

      function onMove(e) {
        const p = e.touches ? e.touches[0] : e;
        if (isDragging) {
          const dx = p.clientX - prevMouse.x;
          const dy = p.clientY - prevMouse.y;
          velocity.y = dx * 0.003;
          velocity.x = dy * 0.003;
          moon.rotation.y += velocity.y;
          moon.rotation.x += velocity.x;
          moon.rotation.x = Math.max(-1.2, Math.min(1.2, moon.rotation.x));
          prevMouse = { x: p.clientX, y: p.clientY };
        }
        mouseVec.x = (p.clientX / window.innerWidth) * 2 - 1;
        mouseVec.y = -(p.clientY / window.innerHeight) * 2 + 1;
      }

      function onUp() { isDragging = false; }

      function onWheel(e) {
        e.preventDefault();
        camera.position.z = Math.max(2.8, Math.min(10, camera.position.z + e.deltaY * 0.004));
      }

      canvas.addEventListener('mousedown', onDown);
      canvas.addEventListener('mousemove', onMove);
      canvas.addEventListener('mouseup', onUp);
      canvas.addEventListener('mouseleave', onUp);
      canvas.addEventListener('wheel', onWheel, { passive: false });

      canvas.addEventListener('click', () => {
        raycaster.setFromCamera(mouseVec, camera);
        const hits = raycaster.intersectObjects(hotspotMeshes);
        if (hits.length > 0) {
          const h = hits[0].object.userData;
          document.getElementById('hud-target').textContent = h.name;
          document.getElementById('hud-prob').textContent = h.prob;
          document.getElementById('hud-cpr').textContent = h.cpr;
          document.getElementById('hud-temp').textContent = h.temp;
          hud.classList.add('visible');
        }
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();

        if (!isDragging) {
          velocity.y *= INERTIA;
          velocity.x *= INERTIA;
          if (Math.abs(velocity.y) < 0.0012) velocity.y = 0.0012;
          moon.rotation.y += velocity.y;
          moon.rotation.x += velocity.x;
        }

        hotspotMeshes.forEach((m, i) => {
          m.material.opacity = 0.6 + Math.sin(t * 3 + i) * 0.4;
          m.scale.setScalar(1 + Math.sin(t * 2 + i) * 0.3);
        });

        atmMat.uniforms.viewVec.value = camera.position;

        raycaster.setFromCamera(mouseVec, camera);
        const hits = raycaster.intersectObjects(hotspotMeshes);
        canvas.style.cursor = hits.length > 0 ? 'pointer' : (isDragging ? 'grabbing' : 'grab');

        renderer.render(scene, camera);
      }

      animate();
      setTimeout(() => { hud.classList.add('visible'); }, 1200);
    })();
  </script>
</body>
</html>
